# SOPS configuration
# Defines encryption rules for secrets in this repo
#
# Setup:
#   1. Install: pacman -S sops age
#   2. Generate keypair: age-keygen -o ~/.config/sops/age/keys.txt
#   3. Paste the public key below (age1...)
#   4. Encrypt: sops -e secrets.yaml > secrets.yaml (in-place) or sops secrets.yaml (interactive)
#
creation_rules:
  - path_regex: docker/.+/alertmanager\.sops\.ya?ml$
    encrypted_regex: ^(bot_token|chat_id)$
    age: >-
      age1vnjflcl0aeefw82f5klz764c4r5ddg9ad63y7vmu58dxmw026sms047q3j,
      age13llaej5dgax7hgmakqdmhhuzrjs72jx2se2n973rgdrvz6wqx5as2edhts

  - path_regex: docker/vars\.sops\.env$
    age: >-
      age1vnjflcl0aeefw82f5klz764c4r5ddg9ad63y7vmu58dxmw026sms047q3j,
      age13llaej5dgax7hgmakqdmhhuzrjs72jx2se2n973rgdrvz6wqx5as2edhts,
      age1hee45x6sq7d3r6eec7tmupgm0lx8zelygr59hqdcjzfjp32z35yqcurr5z

  - path_regex: docker/edge/.+\.sops\.(env|ya?ml|json)$
    age: >-
      age1vnjflcl0aeefw82f5klz764c4r5ddg9ad63y7vmu58dxmw026sms047q3j,
      age1hee45x6sq7d3r6eec7tmupgm0lx8zelygr59hqdcjzfjp32z35yqcurr5z

  # Docker Compose secrets for the VMs (decrypted by doco-cd): encrypt all values
  - path_regex: docker/.+\.sops\.(env|ya?ml|json)$
    age: >-
      age1vnjflcl0aeefw82f5klz764c4r5ddg9ad63y7vmu58dxmw026sms047q3j,
      age13llaej5dgax7hgmakqdmhhuzrjs72jx2se2n973rgdrvz6wqx5as2edhts

  # Encrypt only the 'stringData' values in secret files
  - path_regex: .*secrets\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1vnjflcl0aeefw82f5klz764c4r5ddg9ad63y7vmu58dxmw026sms047q3j
