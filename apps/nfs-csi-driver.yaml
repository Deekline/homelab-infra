apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nfs-csi-driver-values
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-infra
  path: ./k3s/nfs-csi-driver
  targetNamespace: flux-system
  prune: true
  timeout: 3m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-csi-driver
  namespace: flux-system
spec:
  interval: 5m
  releaseName: nfs-csi-driver
  targetNamespace: kube-system
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.4"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: nfs-csi-driver-helm-values
      valuesKey: values.yaml
