apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnativepg-values
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-infra
  path: ./k3s/cloudnativepg
  targetNamespace: flux-system
  prune: true
  timeout: 3m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnativepg
  namespace: flux-system
spec:
  interval: 5m
  releaseName: cloudnativepg
  targetNamespace: cnpg-system
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.28.3"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: cloudnativepg-helm-values
      valuesKey: values.yaml
