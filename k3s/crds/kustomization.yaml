apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # CloudNativePG
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/config/crd/bases/postgresql.cnpg.io_backups.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/config/crd/bases/postgresql.cnpg.io_clusters.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/config/crd/bases/postgresql.cnpg.io_poolers.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/config/crd/bases/postgresql.cnpg.io_scheduledbackups.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/config/crd/bases/postgresql.cnpg.io_databaseroles.yaml
  # Gateway API v1.6.3 (standard channel). TCPRoute/UDPRoute/ListenerSet are
  # genuinely optional per the cilium-operator's own startup log
  # (optionalGVK) and are skipped: phase 4 uses plain HTTPRoute with TLS
  # terminated at the Gateway, not passthrough. TLSRoute, despite being
  # described as optional in Cilium's docs, is actually in the operator's
  # requiredGVK check on 1.20.2 — omitting it crash-loops the gateway-api
  # leader-lifecycle startup check ("tlsroutes.gateway.networking.k8s.io
  # not found"), confirmed 2026-10-31. Keep it installed even though no
  # TLSRoute object will ever be created.
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.3/config/crd/standard/gateway.networking.k8s.io_gatewayclasses.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.3/config/crd/standard/gateway.networking.k8s.io_gateways.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.3/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.3/config/crd/standard/gateway.networking.k8s.io_referencegrants.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.3/config/crd/standard/gateway.networking.k8s.io_grpcroutes.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.3/config/crd/standard/gateway.networking.k8s.io_backendtlspolicies.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.3/config/crd/standard/gateway.networking.k8s.io_tlsroutes.yaml
