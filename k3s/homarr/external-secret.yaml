apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-secrets
  namespace: homarr
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: homarr-secrets
  data:
    - secretKey: SECRET_ENCRYPTION_KEY
      remoteRef:
        key: homarr
        property: SECRET_ENCRYPTION_KEY
