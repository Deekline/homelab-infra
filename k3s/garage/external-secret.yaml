apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-config
  namespace: garage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: garage-config
  data:
    - secretKey: garage.toml
      remoteRef:
        key: garage
        property: garage.toml
