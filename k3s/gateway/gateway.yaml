apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway
  namespace: gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      kube-vip.io/loadbalancerIPs: "10.0.10.9"
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.d-kline.org"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: d-kline-org-tls
      allowedRoutes:
        namespaces:
          from: All
