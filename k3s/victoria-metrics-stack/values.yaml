# Chart-defined key name (victoria-metrics-k8s-stack), not renameable — needed
# whenever the Helm release name doesn't match what VMServiceScrapes expect,
# regardless of GitOps tool. Currently applied via Flux's HelmRelease.
argocdReleaseOverride: monitoring

grafana:
  enabled: false

vmsingle:
  enabled: true
  spec:
    retentionPeriod: "30d"
    resources:
      requests:
        cpu: 75m
        memory: 1088Mi
      limits:
        memory: 1280Mi
    storage:
      storageClassName: nfs-monitoring
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - loki
              topologyKey: kubernetes.io/hostname

vmagent:
  enabled: true
  additionalRemoteWrites:
    - url: http://10.0.10.11:8428/api/v1/write
  spec:
    scrapeInterval: 60s
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 512Mi
    nodeSelector:
      kubernetes.io/hostname: k3s-worker-2

vmalert:
  enabled: false

alertmanager:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

defaultRules:
  enabled: false

defaultDashboards:
  enabled: false

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true
