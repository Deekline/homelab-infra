apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alert-rules.yaml
  - flux-controller-scrape.yaml
  - homelab-overview-dashboard.yaml
  - ingressroutes.yaml
  - secrets.yaml
configMapGenerator:
  - name: victoria-metrics-stack-helm-values
    namespace: flux-system
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
