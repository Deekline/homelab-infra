apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Barman Cloud CNPG-I plugin — the supported replacement for the
  # deprecated in-tree spec.backup.barmanObjectStore integration
  # (deprecated since CNPG 1.26, removal targeted for 1.31; operator here
  # is already on 1.30). Requires operator >=1.26 and cert-manager, both
  # already true for this cluster. Namespace (cnpg-system) is hardcoded
  # in the upstream manifest, not templated — must match wherever
  # cloudnativepg's HelmRelease lands the operator.
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.14.0/manifest.yaml
