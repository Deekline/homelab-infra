apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bazarr
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: bazarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
