apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bazarr
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: bazarr
  # Bazarr pulls from Sonarr/Radarr; nothing calls back into Bazarr's own
  # port for normal operation, so only Traefik (WebUI) is a legitimate
  # caller.
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
  # No egress restriction this pass — Bazarr needs to reach Sonarr/Radarr
  # plus subtitle-provider sites on the internet. Deferred to the
  # FQDN-egress phase.
