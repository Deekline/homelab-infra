apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-vars
  namespace: flux-system
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cluster-vars
  data:
    - secretKey: DOMAIN
      remoteRef:
        key: cluster-vars
        property: DOMAIN
    - secretKey: NFS_SERVER
      remoteRef:
        key: cluster-vars
        property: NFS_SERVER
    - secretKey: K3S_API_VIP
      remoteRef:
        key: cluster-vars
        property: K3S_API_VIP
    - secretKey: VM_METRICS_HOST
      remoteRef:
        key: cluster-vars
        property: VM_METRICS_HOST
    - secretKey: OPENBAO_IP
      remoteRef:
        key: cluster-vars
        property: OPENBAO_IP
