apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway
  hostnames:
    - "calibre-web.d-kline.org"
  rules:
    - backendRefs:
        - name: calibre-web
          port: 8083
