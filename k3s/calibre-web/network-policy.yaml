apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  endpointSelector:
    matchLabels:
      app: calibre-web
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
