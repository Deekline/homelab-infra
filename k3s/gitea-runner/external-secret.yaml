apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-token
  namespace: gitea-runner
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: gitea-runner-token
  data:
    - secretKey: token
      remoteRef:
        key: gitea_runner
        property: token
