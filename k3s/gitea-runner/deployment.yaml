---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-data
  namespace: gitea-runner
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-docker-storage-pvc
  namespace: gitea-runner
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-act-cache-pvc
  namespace: gitea-runner
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      restartPolicy: Always
      containers:
        - name: runner
          image: gitea/act_runner:0.6.1
          command:
            - sh
            - -c
            - |
              while ! nc -z localhost 2375; do sleep 1; done
              # GitHub's HTTP/2 endpoint intermittently sends a stream CANCEL
              # when multiple concurrent job containers clone the same action
              # at once (capacity: 3 == up to 3 simultaneous clones). Forcing
              # HTTP/1.1 avoids the multiplexed-stream failure mode.
              git config --global http.version HTTP/1.1
              # Register only if not already registered (persisted in PVC)
              if [ ! -f /data/.runner ]; then
                act_runner register --no-interactive \
                  --config /config/config.yaml \
                  --instance "$GITEA_INSTANCE_URL" \
                  --token "$GITEA_RUNNER_REGISTRATION_TOKEN" \
                  --name "$GITEA_RUNNER_NAME" \
                  --labels "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest,ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04"
              fi
              act_runner daemon --config /config/config.yaml
          env:
            - name: GITEA_INSTANCE_URL
              value: "http://10.0.10.150:30008"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-token
                  key: token
            - name: GITEA_RUNNER_NAME
              value: "k3s-runner"
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: act-cache
              mountPath: /root/.cache/act
            - name: cache
              mountPath: /cache
          # No HTTP surface at all (no metrics/health port in config.yaml,
          # confirmed no Service in front) — process check is the only
          # option. Deliberately not "pgrep -f act_runner daemon": the
          # entrypoint's own wrapper script (PID 1, comm "sh") contains
          # that exact string in its argv and self-matches, so -f always
          # succeeds even if the actual daemon process died. Plain
          # "pgrep act_runner" matches only the real binary by comm name.
          readinessProbe:
            exec:
              command: ["pgrep", "act_runner"]
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["pgrep", "act_runner"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        - name: dind
          image: docker:29-dind
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          readinessProbe:
            exec:
              command: ["docker", "info"]
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["docker", "info"]
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: docker-storage-pvc
              mountPath: /var/lib/docker

      volumes:
        - name: config
          configMap:
            name: gitea-runner-config
        - name: data
          persistentVolumeClaim:
            claimName: gitea-runner-data
        - name: docker-storage-pvc
          persistentVolumeClaim:
            claimName: gitea-runner-docker-storage-pvc
        - name: act-cache
          persistentVolumeClaim:
            claimName: gitea-runner-act-cache-pvc
        - name: cache
          emptyDir: {}
