apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-power-tools-secrets
  namespace: immich
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: immich-power-tools-secrets
  data:
    - secretKey: api_key
      remoteRef:
        key: immich-power-tools
        property: api_key
