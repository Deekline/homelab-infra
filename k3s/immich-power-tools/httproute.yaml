apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-power-tools
  namespace: immich
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway
  hostnames:
    - "immich-tools.d-kline.org"
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: immich-power-tools
          port: 3000
