apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: radarr
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app: radarr
  # Same shape as sonarr's policy: Traefik (WebUI), Prowlarr (pushes
  # indexer config), Bazarr (pulls movie metadata for subtitle matching),
  # and Seerr (submits requests) are the only legitimate callers.
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: prowlarr
        - matchLabels:
            app: bazarr
        - matchLabels:
            app: seerr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
  # No egress restriction this pass — same reasoning as sonarr's policy.
