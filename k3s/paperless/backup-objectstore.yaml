apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: paperless-db-backup
  namespace: paperless
spec:
  configuration:
    destinationPath: s3://cnpg-backups/paperless-db/
    endpointURL: http://garage.garage.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: paperless-db-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: paperless-db-backup-credentials
        key: ACCESS_SECRET_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
  retentionPolicy: 14d
