apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-db-credentials
  namespace: paperless
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: paperless-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: paperless
        property: username
    - secretKey: password
      remoteRef:
        key: paperless
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secret-key
  namespace: paperless
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: paperless-secret-key
  data:
    - secretKey: secret-key
      remoteRef:
        key: paperless
        property: secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-secret
  namespace: paperless
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: dragonfly-secret
  data:
    - secretKey: password
      remoteRef:
        key: dragonfly
        property: password
