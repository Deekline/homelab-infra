apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: paperless-db-backup
  namespace: paperless
spec:
  cluster:
    name: paperless-db
  # nightly at 21:00 (6-field cron: seconds minutes hours day month weekday)
  schedule: "0 0 21 * * *"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
