apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway
  hostnames:
    - "paperless.d-kline.org"
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: paperless-web
          port: 8000
