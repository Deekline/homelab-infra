container_runtime: containerd

lapi:
  secrets:
    existingSecret: crowdsec-secrets
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  persistentVolume:
    config:
      enabled: true
      existingClaim: crowdsec-config-nfs
    data:
      enabled: true
      existingClaim: crowdsec-db-nfs
  env:
    - name: ENROLL_KEY
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: enrollKey
          optional: true
    - name: APPRISE_URL
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: appriseUrl
  extraVolumeMounts:
    - name: crowdsec-profiles-volume
      mountPath: /etc/crowdsec/profiles.yaml
      subPath: profiles.yaml
    - name: crowdsec-config-local-volume
      mountPath: /etc/crowdsec/config.yaml.local
      subPath: config.yaml.local
    - name: crowdsec-notifications-http
      mountPath: /etc/crowdsec/notifications/http.yaml
      subPath: http.yaml

config:
  config.yaml.local: |
    api:
      server:
        auto_registration:
          enabled: true
          token: "${REGISTRATION_TOKEN}"
          allowed_ranges:
            - "127.0.0.1/32"
            - "10.0.0.0/8"
    db_config:
      flush:
        agents_autodelete:
          login_password: 6h

  profiles.yaml: |
    name: default_ip_remediation
    filters:
      - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
      - type: ban
        duration: 4h
    notifications:
      - http_default
    on_success: break

  notifications:
    http.yaml: |
      type: http
      name: http_default
      log_level: info
      group_wait: 30s
      group_threshold: 10
      format: |
        {
          "title": "CrowdSec ban",
          "body": "{{ range . }}{{ range .Decisions }}{{ .Value }} banned for {{ .Duration }} ({{ .Scenario }}); {{ end }}{{ end }}",
          "type": "warning"
        }
      url: ${APPRISE_URL}
      method: POST
      headers:
        Content-Type: application/json

agent:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/traefik crowdsecurity/linux"
    - name: USERNAME
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: agentUsername
    - name: REGISTRATION_TOKEN
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: registrationToken
    - name: CUSTOM_HOSTNAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  acquisition:
    - namespace: traefik
      podName: traefik-*
      program: traefik
      poll_without_inotify: true
