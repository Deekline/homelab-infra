apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-db-credentials
  namespace: n8n
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: n8n-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: n8n
        property: username
    - secretKey: password
      remoteRef:
        key: n8n
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-encryption-key
  namespace: n8n
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: n8n-encryption-key
  data:
    - secretKey: encryption-key
      remoteRef:
        key: n8n
        property: encryption-key
