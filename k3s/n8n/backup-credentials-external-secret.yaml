apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-db-backup-credentials
  namespace: n8n
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: n8n-db-backup-credentials
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: n8n-db-backup
        property: ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: n8n-db-backup
        property: ACCESS_SECRET_KEY
