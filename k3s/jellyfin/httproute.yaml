apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway
  hostnames:
    - "jellyfin.d-kline.org"
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: jellyfin
          port: 8096
