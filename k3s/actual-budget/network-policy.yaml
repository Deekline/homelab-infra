apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: actual-budget
  namespace: actual-budget
spec:
  endpointSelector:
    matchLabels:
      app: actual-budget
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: actual-http-api
      toPorts:
        - ports:
            - port: "5006"
              protocol: TCP
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5006"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
