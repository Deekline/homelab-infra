apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-http-api
  namespace: actual-budget
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: actual-http-api
  data:
    - secretKey: server-password
      remoteRef:
        key: actual-budget
        property: server-password
    - secretKey: api-key
      remoteRef:
        key: actual-budget
        property: api-key
