apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-secret
  namespace: dragonfly
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: dragonfly-secret
  data:
    - secretKey: password
      remoteRef:
        key: dragonfly
        property: password
