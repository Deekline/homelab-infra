apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: drawio
  namespace: drawio
spec:
  endpointSelector:
    matchLabels:
      app: drawio
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
