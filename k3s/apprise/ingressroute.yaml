apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apprise
  namespace: apprise
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`apprise.d-kline.org`) && PathPrefix(`/notify`)
      services:
        - name: apprise
          port: 80
    - kind: Rule
      match: Host(`apprise.d-kline.org`)
      services:
        - name: apprise
          port: 80
  tls: {}
