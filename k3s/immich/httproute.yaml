apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway
  hostnames:
    - "immich.d-kline.org"
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: immich-server
          port: 2283
