apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-db-backup
  namespace: immich
spec:
  cluster:
    name: immich-db
  # nightly at 21:15 (6-field cron: seconds minutes hours day month weekday)
  schedule: "0 15 21 * * *"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
