apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affine
  namespace: affine
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway
  hostnames:
    - "affine.d-kline.org"
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - name: affine
          port: 3010
