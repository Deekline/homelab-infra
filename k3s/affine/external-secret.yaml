apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-db-credentials
  namespace: affine
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: affine-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: affine
        property: username
    - secretKey: password
      remoteRef:
        key: affine
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-secret
  namespace: affine
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: dragonfly-secret
  data:
    - secretKey: password
      remoteRef:
        key: dragonfly
        property: password
