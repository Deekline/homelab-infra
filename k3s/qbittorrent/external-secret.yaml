apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn-secrets
  namespace: media
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: qbittorrent-vpn-secrets
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: qbittorrent
        property: WIREGUARD_PRIVATE_KEY
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: qbittorrent
        property: WIREGUARD_ADDRESSES
    - secretKey: QBITTORRENT_API_KEY
      remoteRef:
        key: qbittorrent
        property: QBITTORRENT_API_KEY
