apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speedtest-tracker-secrets
  namespace: speedtest-tracker
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: speedtest-tracker-secrets
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: speedtest-tracker
        property: APP_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speedtest-tracker-db-credentials
  namespace: speedtest-tracker
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: speedtest-tracker-db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: speedtest-tracker
        property: username
    - secretKey: password
      remoteRef:
        key: speedtest-tracker
        property: password
