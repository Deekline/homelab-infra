apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-credentials
  namespace: cert-manager
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflare-credentials
  data:
    - secretKey: email
      remoteRef:
        key: cert-manager
        property: email
    - secretKey: api-token
      remoteRef:
        key: cert-manager
        property: api-token
