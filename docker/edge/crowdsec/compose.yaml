services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - bouncer.sops.env
    environment:
      COLLECTIONS: crowdsecurity/traefik crowdsecurity/linux
      CUSTOM_HOSTNAME: edge
      OBSERVABILITY_IP: ${OBSERVABILITY_IP:?}
    configs:
      - source: acquis
        target: /etc/crowdsec/acquis.d/traefik.yaml
      - source: profiles
        target: /etc/crowdsec/profiles.yaml
      - source: notification-alertmanager
        target: /etc/crowdsec/notifications/alertmanager.yaml
    volumes:
      - /srv/crowdsec/config:/etc/crowdsec
      - /srv/crowdsec/data:/var/lib/crowdsec/data
      - /srv/traefik/logs:/var/log/traefik:ro
    ports:
      - "6060:6060"

configs:
  acquis:
    file: ./acquis.yaml
  profiles:
    file: ./profiles.yaml
  notification-alertmanager:
    file: ./notification-alertmanager.yaml

networks:
  default:
    name: edge
    external: true
