data_dir: /var/lib/vector

sources:
  traefik_access:
    type: file
    include:
      - /var/log/traefik/access.log

  journal:
    type: journald

transforms:
  traefik_access_shaped:
    type: remap
    inputs: [traefik_access]
    source: |
      . = object!(parse_json!(.message))
      .timestamp = parse_timestamp(.time, "%+") ?? now()
      del(.time)
      .host = get_hostname!()
      .service = "traefik"
      .log_type = "access"
      method = to_string(.RequestMethod) ?? "-"
      host = to_string(.RequestHost) ?? "-"
      path = to_string(.RequestPath) ?? ""
      status = to_string(.DownstreamStatus) ?? "-"
      .message = method + " " + host + path + " " + status

  journal_shaped:
    type: remap
    inputs: [journal]
    source: |
      service = string(.CONTAINER_NAME) ?? string(._SYSTEMD_UNIT) ?? string(.SYSLOG_IDENTIFIER) ?? "unknown"
      log_type = "system"
      if exists(.CONTAINER_NAME) {
        log_type = "container"
      }
      . = {
        "timestamp": .timestamp,
        "message": .message,
        "host": .host,
        "service": service,
        "priority": .PRIORITY,
        "log_type": log_type
      }

sinks:
  victorialogs:
    type: elasticsearch
    inputs: [traefik_access_shaped, journal_shaped]
    endpoints:
      - http://${OBSERVABILITY_IP}:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: host,service,log_type
