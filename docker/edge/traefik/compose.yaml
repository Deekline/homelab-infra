services:
  traefik-init:
    image: busybox:1.37.0
    command: ["sh", "-c", "mkdir -p /data/logs /data/plugins-storage && chown -R 65532:65532 /data"]
    volumes:
      - /srv/traefik:/data

  traefik:
    image: traefik:v3.6.25
    restart: unless-stopped
    depends_on:
      traefik-init:
        condition: service_completed_successfully
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - cloudflare.sops.env
      - ../crowdsec/bouncer.sops.env
    environment:
      DOMAIN: ${DOMAIN:?}
      GATEWAY_IP: ${GATEWAY_IP:?}
      PVE_IP: ${PVE_IP:?}
      PX1_IP: ${PX1_IP:?}
      PX2_IP: ${PX2_IP:?}
      NAS_IP: ${NAS_IP:?}
      PIHOLE_IP: ${PIHOLE_IP:?}
      HA_IP: ${HA_IP:?}
      MGMT_SOURCES: ${MGMT_SOURCES:?}
      OBSERVABILITY_IP: ${OBSERVABILITY_IP:?}
    configs:
      - source: static
        target: /etc/traefik/traefik.yml
      - source: dynamic
        target: /etc/traefik/dynamic/dynamic.yaml
      - source: external-services
        target: /etc/traefik/dynamic/external-services.yaml
    volumes:
      - /srv/traefik:/data
      - /srv/traefik/logs:/var/log/traefik
      - /srv/traefik/plugins-storage:/plugins-storage
    ports:
      - "80:8000"
      - "443:8443"
      - "8080:8080"

configs:
  static:
    file: ./traefik.yaml
  dynamic:
    file: ./dynamic.yaml
  external-services:
    file: ./external-services.yaml

networks:
  default:
    name: edge
    external: true
