http:
  routers:
    pve:
      rule: 'Host(`pve.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: pve
      tls: {}

    pve1:
      rule: 'Host(`pve1.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: pve1
      tls: {}

    pve2:
      rule: 'Host(`pve2.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: pve2
      tls: {}

    nas:
      rule: 'Host(`nas.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: nas
      tls: {}

    pihole:
      rule: 'Host(`pihole.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: pihole
      tls: {}

    gitea:
      rule: 'Host(`gitea.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: gitea
      tls: {}

    ha:
      rule: 'Host(`ha.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: ha
      tls: {}

    grafana:
      rule: 'Host(`grafana.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, local-only]
      service: grafana
      tls: {}

    metrics:
      rule: 'Host(`metrics.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: metrics
      tls: {}

    logs:
      rule: 'Host(`logs.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: logs
      tls: {}

    alerts:
      rule: 'Host(`alerts.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: alerts
      tls: {}

    vmalert:
      rule: 'Host(`vmalert.{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      middlewares: [crowdsec, mgmt-only]
      service: vmalert
      tls: {}

  services:
    pve:
      loadBalancer:
        serversTransport: self-signed
        servers:
          - url: 'https://{{ env "PVE_IP" }}:8006'

    pve1:
      loadBalancer:
        serversTransport: self-signed
        servers:
          - url: 'https://{{ env "PX1_IP" }}:8006'

    pve2:
      loadBalancer:
        serversTransport: self-signed
        servers:
          - url: 'https://{{ env "PX2_IP" }}:8006'

    nas:
      loadBalancer:
        serversTransport: self-signed
        servers:
          - url: 'https://{{ env "NAS_IP" }}'

    pihole:
      loadBalancer:
        servers:
          - url: 'http://{{ env "PIHOLE_IP" }}'

    gitea:
      loadBalancer:
        servers:
          - url: 'http://{{ env "NAS_IP" }}:30008'

    ha:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: 'http://{{ env "HA_IP" }}:8123'

    grafana:
      loadBalancer:
        servers:
          - url: 'http://{{ env "OBSERVABILITY_IP" }}:3000'

    metrics:
      loadBalancer:
        servers:
          - url: 'http://{{ env "OBSERVABILITY_IP" }}:8428'

    logs:
      loadBalancer:
        servers:
          - url: 'http://{{ env "OBSERVABILITY_IP" }}:9428'

    alerts:
      loadBalancer:
        servers:
          - url: 'http://{{ env "OBSERVABILITY_IP" }}:9093'

    vmalert:
      loadBalancer:
        servers:
          - url: 'http://{{ env "OBSERVABILITY_IP" }}:8880'

  serversTransports:
    self-signed:
      insecureSkipVerify: true

  middlewares:
    mgmt-only:
      ipAllowList:
        sourceRange:
{{- range $source := splitList "," (env "MGMT_SOURCES") }}
          - {{ trim $source }}
{{- end }}
