services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -selfScrapeInterval=60s
      - -promscrape.config=/etc/victoriametrics/scrape.yaml
    configs:
      - source: victoriametrics-scrape
        target: /etc/victoriametrics/scrape.yaml
    volumes:
      - /srv/data/victoriametrics:/storage
    ports:
      - "8428:8428"

  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.10.1
    restart: unless-stopped
    env_file:
      - pve-exporter.sops.env
    environment:
      PVE_VERIFY_SSL: "false"

  opnsense-exporter:
    image: ghcr.io/athennamind/opnsense-exporter:0.0.18
    restart: unless-stopped
    command:
      - --opnsense.protocol=https
      - --opnsense.address=${OPNSENSE_IP:?}
      - --opnsense.insecure
      - --exporter.instance-label=opnsense
      - --exporter.disable-carp
      - --exporter.disable-ipsec
      - --exporter.disable-openvpn
      - --web.listen-address=:8080
    env_file:
      - opnsense-exporter.sops.env

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=7d
    volumes:
      - /srv/data/victorialogs:/storage
    ports:
      - "9428:9428"

  grafana-init:
    image: busybox:1.37.0
    command: ["chown", "-R", "472:472", "/var/lib/grafana"]
    volumes:
      - /srv/data/grafana:/var/lib/grafana

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    depends_on:
      grafana-init:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
    env_file:
      - .sops.env
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.33.1
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: grafana-dashboard-provider
        target: /etc/grafana/provisioning/dashboards/provider.yaml
    volumes:
      - /srv/data/grafana:/var/lib/grafana
      - ./dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"

  alertmanager-init:
    image: busybox:1.37.0
    command: ["chown", "-R", "65534:65534", "/alertmanager"]
    volumes:
      - /srv/data/alertmanager:/alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    depends_on:
      alertmanager-init:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://${OBSERVABILITY_IP:?}:9093
    volumes:
      - ./alertmanager.sops.yml:/etc/alertmanager/alertmanager.yml:ro
      - /srv/data/alertmanager:/alertmanager
    ports:
      - "9093:9093"

  vmalert:
    image: victoriametrics/vmalert:v1.154.0
    restart: unless-stopped
    depends_on:
      victoriametrics:
        condition: service_started
      alertmanager:
        condition: service_started
    command:
      - -rule=/etc/vmalert/rules/*.yaml
      - -datasource.url=http://victoriametrics:8428
      - -remoteWrite.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -evaluationInterval=60s
      - -external.url=http://${OBSERVABILITY_IP:?}:8880
    volumes:
      - ./rules:/etc/vmalert/rules:ro
    ports:
      - "8880:8880"

configs:
  victoriametrics-scrape:
    content: |
      scrape_configs:
        - job_name: pve
          scrape_interval: 60s
          metrics_path: /pve
          params:
            cluster: ["1"]
            node: ["1"]
          static_configs:
            - targets: ["${PVE_IP:?}"]
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: pve-exporter:9221
        - job_name: opnsense
          scrape_interval: 60s
          scrape_timeout: 30s
          static_configs:
            - targets: ["opnsense-exporter:8080"]
  grafana-dashboard-provider:
    content: |
      apiVersion: 1
      providers:
        - name: homelab
          type: file
          allowUiUpdates: false
          options:
            path: /etc/grafana/dashboards
            foldersFromFilesStructure: true
  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          uid: victoriametrics
          url: http://victoriametrics:8428
          access: proxy
          isDefault: true
          jsonData:
            timeInterval: 60s
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          uid: victorialogs
          url: http://victorialogs:9428
          access: proxy
