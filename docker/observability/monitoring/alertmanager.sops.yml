global:
    resolve_timeout: 5m
route:
    group_by:
        - alertname
        - namespace
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    receiver: telegram
    routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
        - receiver: "null"
          matchers:
            - alertname = "RecordingRulesNoData"
            - recording = "count:up0"
receivers:
    - name: "null"
    - name: telegram
      telegram_configs:
        - bot_token: ENC[AES256_GCM,data:tQeWeuEVEjVe+ZKBMzI7FA8PjYfSQqRpnJYGf0Xa9rMiJ0jpf30aR8dWICBWdA==,iv:DrZ8lfT5bq7X/5zG8mo/eKmyzjcQ3umpcG9FhPsj+FY=,tag:DAanFPBPO8Oz4emuGnJG+g==,type:str]
