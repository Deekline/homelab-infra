          send_resolved: true
          parse_mode: ""
          message: "[VM] {{ if eq .Status \"firing\" }}\U0001F525 FIRING{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}\n{{- if .CommonLabels.severity }}\nSeverity: {{ .CommonLabels.severity }}{{ end }}\n{{- if .CommonLabels.namespace }}\nNamespace: {{ .CommonLabels.namespace }}{{ end }}\n{{- range .Alerts }}\n{{ .Annotations.summary }}\n{{- end }}"
inhibit_rules:
    - source_matchers:
        - severity = "critical"
      target_matchers:
        - severity = "warning"
      equal:
        - alertname
        - namespace
        - pod
