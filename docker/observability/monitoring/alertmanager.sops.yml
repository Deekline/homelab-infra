global:
    resolve_timeout: 5m
route:
    group_by:
        - alertname
        - namespace
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    receiver: telegram
    routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
        - receiver: "null"
          matchers:
            - alertname = "RecordingRulesNoData"
            - recording = "count:up0"
receivers:
    - name: "null"
    - name: telegram
      telegram_configs:
        - bot_token: ENC[AES256_GCM,data:9zBR3Lhn6SgL5/pnc8fsdDI0D4fbxCK/zNnqe6GUn0Kr7dqWvgbsoljqvG+xOQ==,iv:IemWYMPBV+sL1sjybyFGAQPdA+0Nsxz/2Cx07UtBHnA=,tag:ACZ6xTcMJtin2MslNWFVDA==,type:str]
          chat_id: ENC[AES256_GCM,data:s+tdA1trczrZcA==,iv:OoGMS4b697T0UTmG+dX+qOCg7pVSldQQ93gcI0DaDNs=,tag:PNAlT0mwFyUha2P7Mt6O4w==,type:int]
          send_resolved: true
          parse_mode: ""
          message: "[VM] {{ if eq .Status \"firing\" }}\U0001F525 FIRING{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}\n{{- if .CommonLabels.severity }}\nSeverity: {{ .CommonLabels.severity }}{{ end }}\n{{- if .CommonLabels.namespace }}\nNamespace: {{ .CommonLabels.namespace }}{{ end }}\n{{- range .Alerts }}\n{{ .Annotations.summary }}\n{{- end }}"
inhibit_rules:
    - source_matchers:
        - severity = "critical"
      target_matchers:
        - severity = "warning"
      equal:
        - alertname
        - namespace
        - pod
