global:
    resolve_timeout: 5m
route:
    group_by:
        - alertname
        - namespace
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    receiver: telegram
    routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
        - receiver: "null"
          matchers:
            - alertname = "RecordingRulesNoData"
            - recording = "count:up0"
receivers:
    - name: "null"
    - name: telegram
      telegram_configs:
        - bot_token: ENC[AES256_GCM,data:aCziaY7z+x255gNDd7lFs2PXBaqeS+Wrlz+8dijuMWYhNGN54lU5ge332iRnHA==,iv:07V+WyU3UxrmZgYNNRbgUFvoJchZ/kEbunOdTYrWYRM=,tag:CXRonfVZlQGR+vBDNzbFfQ==,type:str]
