scrape_configs:
  - job_name: pve
    scrape_interval: 60s
    metrics_path: /pve
    params:
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: ["%{PVE_IP}"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
    metric_relabel_configs:
      - source_labels: [__name__, id]
        regex: "pve_(cpu_usage_.+|memory_.+|disk_.+|uptime_seconds|up);node/.+"
        action: drop
  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["%{PVE_IP}:9100"]
  - job_name: traefik-edge
    scrape_interval: 30s
    static_configs:
      - targets: ["%{EDGE_IP}:8080"]
  - job_name: crowdsec-edge
    scrape_interval: 30s
    static_configs:
      - targets: ["%{EDGE_IP}:6060"]
  - job_name: opnsense
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["opnsense-exporter:8080"]
