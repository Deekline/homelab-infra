apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sonarr
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-infra
  path: ./k3s/sonarr
  prune: true
  timeout: 3m
  dependsOn:
    - name: media-storage
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: sonarr
      namespace: media
